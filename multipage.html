     <style>
        body {
    font-family: Arial, sans-serif;

}

/* HEADER */
header {
    text-align: center;
    padding: 20px 0;

}

/* CONTENT AREA */
.content {
    padding: 30px;
    max-width: 900px;
    margin: auto;
}

h2 {
    margin-bottom: 15px;
}

ul {
    padding-left: 15px;
}

li {
    margin-bottom: 10px;
}

a {
    color: #004080;
}

/* BOTTOM LINKS */
.bottom-links {
    margin-top: 30px;
    font-size: 18px;
    text-align: left;
}

.bottom-links a {
    color: #004080;
    text-decoration: none;
}

.bottom-links a:hover {
    text-decoration: underline;
}
    </style>
</head>
